<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 320" fill="none">
  <defs>
    <linearGradient id="c1" x1="140" y1="15" x2="140" y2="305" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="18%" stop-color="#ececec"/>
      <stop offset="40%" stop-color="#8e8e8e"/>
      <stop offset="50%" stop-color="#f8f8f8"/>
      <stop offset="60%" stop-color="#9a9a9a"/>
      <stop offset="82%" stop-color="#d8d8d8"/>
      <stop offset="100%" stop-color="#5a5a5a"/>
    </linearGradient>
    <linearGradient id="c2" x1="30" y1="160" x2="250" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6a6a6a"/>
      <stop offset="30%" stop-color="#c4c4c4"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#b0b0b0"/>
      <stop offset="100%" stop-color="#5e5e5e"/>
    </linearGradient>
    <linearGradient id="dark" x1="140" y1="40" x2="140" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="50%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="light" x1="80" y1="40" x2="200" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#d0d0d0"/>
      <stop offset="100%" stop-color="#8a8a8a"/>
    </linearGradient>
    <filter id="g" x="-8%" y="-8%" width="116%" height="116%">
      <feGaussianBlur stdDeviation="1" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Contour du losange Renault -->
  <path d="M140 18 L255 100 L255 220 L140 302 L25 220 L25 100 Z"
        stroke="url(#c1)" stroke-width="14" fill="none" stroke-linejoin="round" filter="url(#g)"/>

  <!-- Face gauche (clair → mi-bas) -->
  <path d="M140 18 L25 100 L25 220 L140 302 L140 160 L95 130 L95 70 Z"
        fill="url(#light)" filter="url(#g)"/>

  <!-- Face droite (sombre) -->
  <path d="M140 18 L255 100 L255 220 L140 302 L140 160 L185 130 L185 70 Z"
        fill="url(#dark)" filter="url(#g)"/>

  <!-- Losange intérieur (trou / réflexion centrale) -->
  <path d="M140 70 L185 115 L185 205 L140 250 L95 205 L95 115 Z"
        fill="none" stroke="url(#c2)" stroke-width="10" stroke-linejoin="round" filter="url(#g)"/>
  <path d="M140 90 L170 125 L170 195 L140 230 L110 195 L110 125 Z"
        fill="none" stroke="url(#c1)" stroke-width="5" stroke-linejoin="round" opacity="0.7"/>

  <!-- Arête centrale (pli vertical du losange) -->
  <path d="M140 18 L140 70" stroke="url(#c2)" stroke-width="6" stroke-linecap="round"/>
  <path d="M140 250 L140 302" stroke="url(#c2)" stroke-width="6" stroke-linecap="round"/>

  <!-- Arêtes diagonales facettées -->
  <path d="M140 18 L95 70 L95 130 L140 160" stroke="url(#c2)" stroke-width="4" fill="none" opacity="0.5"/>
  <path d="M140 18 L185 70 L185 130 L140 160" stroke="#444" stroke-width="4" fill="none" opacity="0.6"/>
  <path d="M140 302 L95 205 L95 195" stroke="url(#c2)" stroke-width="4" fill="none" opacity="0.45"/>
  <path d="M140 302 L185 205 L185 195" stroke="#444" stroke-width="4" fill="none" opacity="0.55"/>

  <!-- Reflets chrome -->
  <path d="M45 95 L130 35" stroke="rgba(255,255,255,0.75)" stroke-width="6" stroke-linecap="round"/>
  <path d="M55 230 L130 285" stroke="rgba(255,255,255,0.4)" stroke-width="5" stroke-linecap="round"/>
  <path d="M115 105 L125 95 L155 95 L165 105" stroke="rgba(255,255,255,0.65)" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>
