# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'firas-bka-car-mrlpqq'
primary_region = 'ams'

[build]

  [build.args]

[env]
  APP_NAME = 'FIRAS BKA CAR'
  APP_ENV = 'production'
  APP_DEBUG = 'false'
  APP_URL = 'https://firas-bka-car-mrlpqq.fly.dev'
  FRONTEND_URL = 'https://firas-bka-car-mrlpqq.fly.dev'
  APP_LOCALE = 'fr'
  FILESYSTEM_DISK = 'public'
  DB_CONNECTION = 'mysql'
  DB_HOST = 'firas-bka-car-mysql.internal'
  DB_PORT = '3306'
  DB_DATABASE = 'firas_bka_car'
  DB_USERNAME = 'firas'
  SESSION_DRIVER = 'database'
  SANCTUM_STATEFUL_DOMAINS = 'firas-bka-car-mrlpqq.fly.dev'
  CACHE_STORE = 'database'
  QUEUE_CONNECTION = 'database'
  MAIL_MAILER = 'log'
  LOG_CHANNEL = 'stderr'
  MEDIA_DISK = 'public'
  PHP_CLI_SERVER_WORKERS = '4'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 250
    soft_limit = 200

[[mounts]]
  source = 'app_storage'
  destination = '/var/www/storage/app/public'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
