# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'firasbkacar'
primary_region = 'ams'

[build]

  [build.args]

[env]
  APP_NAME = 'FIRAS BKA CAR'
  APP_ENV = 'production'
  APP_DEBUG = 'false'
  APP_URL = 'https://firasbkacar.fly.dev'
  FRONTEND_URL = 'https://firasbkacar.fly.dev'
  APP_LOCALE = 'fr'
  FILESYSTEM_DISK = 'public'
  DB_CONNECTION = 'mysql'
  DB_HOST = 'firas-bka-car-mysql.internal'
  DB_PORT = '3306'
  DB_DATABASE = 'firas_bka_car'
  DB_USERNAME = 'firas'
  SESSION_DRIVER = 'database'
  SESSION_DOMAIN = '.firasbkacar.fly.dev'
  SANCTUM_STATEFUL_DOMAINS = 'firasbkacar.fly.dev'
  CACHE_STORE = 'database'
  QUEUE_CONNECTION = 'database'
  MAIL_MAILER = 'smtp'
  MAIL_HOST = 'smtp.gmail.com'
  MAIL_PORT = '587'
  MAIL_ENCRYPTION = 'tls'
  MAIL_FROM_ADDRESS = 'firasbkacars@gmail.com'
  MAIL_FROM_NAME = 'FIRAS BKA CAR'
  LOG_CHANNEL = 'stderr'
  MEDIA_DISK = 'public'
  PHP_CLI_SERVER_WORKERS = '4'

  # Paiement carte.
  # 'sandbox' : passerelle simulee, aucune donnee bancaire reelle, aucun
  # contrat requis. Permet de valider tout le parcours (initiation, page
  # de carte, retour, webhook, idempotence, remboursement).
  # Basculez en 'production' uniquement apres avoir renseigne
  # CMI_MERCHANT_KEY / CMI_MERCHANT_SECRET et verifie le contrat API.
  CMI_MODE = 'sandbox'
  CMI_RETURN_URL = 'https://firasbkacar.fly.dev/api/cmi/callback'
  CMI_CANCEL_URL = 'https://firasbkacar.fly.dev/api/cmi/cancel'
  CMI_NOTIFY_URL = 'https://firasbkacar.fly.dev/api/cmi/webhook'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 250
    soft_limit = 200

[[mounts]]
  source = 'app_storage'
  destination = '/var/www/storage/app/public'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
