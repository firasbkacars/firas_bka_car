# fly.toml app configuration file generated for firas-bka-car-mrlpqq on 2026-10-10T15:10:05Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'firas-bka-car-mrlpqq'
primary_region = 'ams'

[build]

[env]
  APP_DEBUG = 'false'
  APP_ENV = 'production'
  APP_LOCALE = 'fr'
  APP_URL = 'https://firas-bka-car.fly.dev'
  CACHE_STORE = 'database'
  DB_CONNECTION = 'mysql'
  DB_DATABASE = 'firas_bka_car'
  DB_PORT = '3306'
  MAIL_MAILER = 'log'
  QUEUE_CONNECTION = 'database'
  SESSION_DRIVER = 'database'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 250
    soft_limit = 200

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
