<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" fill="none">
  <defs>
    <linearGradient id="c1" x1="160" y1="15" x2="160" y2="265" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="18%" stop-color="#ececec"/>
      <stop offset="40%" stop-color="#8e8e8e"/>
      <stop offset="50%" stop-color="#f8f8f8"/>
      <stop offset="60%" stop-color="#9a9a9a"/>
      <stop offset="82%" stop-color="#d8d8d8"/>
      <stop offset="100%" stop-color="#5a5a5a"/>
    </linearGradient>
    <linearGradient id="c2" x1="40" y1="140" x2="280" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6e6e6e"/>
      <stop offset="30%" stop-color="#c8c8c8"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#b8b8b8"/>
      <stop offset="100%" stop-color="#606060"/>
    </linearGradient>
    <linearGradient id="c3" x1="160" y1="40" x2="160" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f2f2f2"/>
      <stop offset="45%" stop-color="#a0a0a0"/>
      <stop offset="100%" stop-color="#4a4a4a"/>
    </linearGradient>
    <linearGradient id="txt" x1="80" y1="70" x2="240" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#d4d4d4"/>
      <stop offset="70%" stop-color="#8a8a8a"/>
      <stop offset="100%" stop-color="#e8e8e8"/>
    </linearGradient>
    <filter id="g" x="-8%" y="-8%" width="116%" height="116%">
      <feGaussianBlur stdDeviation="1" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Bouclier Dacia (écusson) -->
  <path d="M40 48
           C40 36 50 28 62 28
           L258 28
           C270 28 280 36 280 48
           L272 150
           C268 190 240 228 200 248
           L160 268
           L120 248
           C80 228 52 190 48 150
           Z"
        fill="none" stroke="url(#c1)" stroke-width="16" filter="url(#g)"/>
  <!-- Liseré intérieur -->
  <path d="M56 52
           C56 46 60 42 66 42
           L254 42
           C260 42 264 46 264 52
           L257 148
           C254 184 230 216 195 234
           L160 252
           L125 234
           C90 216 66 184 63 148
           Z"
        fill="none" stroke="url(#c2)" stroke-width="4" opacity="0.6"/>

  <!-- Reflet haut du bouclier -->
  <path d="M55 55 C55 48 60 44 68 44 L250 44" stroke="rgba(255,255,255,0.7)" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- Bandeau texte DACIA -->
  <path d="M70 78 L250 78 L246 118 L74 118 Z" fill="url(#c3)" opacity="0.25"/>
  <path d="M70 78 L250 78" stroke="url(#c2)" stroke-width="3" opacity="0.7"/>
  <path d="M74 118 L246 118" stroke="url(#c2)" stroke-width="3" opacity="0.7"/>

  <text x="160" y="108" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="42" font-weight="800" letter-spacing="6"
        fill="url(#txt)" filter="url(#g)">DACIA</text>

  <!-- Emblème bas (forme caractéristique Dacia - double arc / V) -->
  <path d="M95 145
           C110 175 135 205 160 230
           C185 205 210 175 225 145"
        stroke="url(#c1)" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#g)"/>
  <path d="M110 150
           C122 175 140 200 160 220
           C180 200 198 175 210 150"
        stroke="url(#c2)" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.55"/>

  <!-- Reflet emblème -->
  <path d="M105 150 C115 170 130 190 145 208" stroke="rgba(255,255,255,0.55)" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Ombre bas -->
  <path d="M70 200 C100 240 130 255 160 265" stroke="url(#c3)" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.35"/>
</svg>
