<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <!-- Anneau chrome -->
    <linearGradient id="ring" x1="200" y1="18" x2="200" y2="382" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.12" stop-color="#e8e8e8"/>
      <stop offset="0.3" stop-color="#8f8f8f"/>
      <stop offset="0.45" stop-color="#ececec"/>
      <stop offset="0.52" stop-color="#6e6e6e"/>
      <stop offset="0.66" stop-color="#c2c2c2"/>
      <stop offset="0.82" stop-color="#5a5a5a"/>
      <stop offset="1" stop-color="#969696"/>
    </linearGradient>
    <!-- Étoile : éclairage global haut-gauche -> bas-droite -->
    <linearGradient id="star" x1="110" y1="30" x2="310" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.2" stop-color="#eaeaea"/>
      <stop offset="0.4" stop-color="#b5b5b5"/>
      <stop offset="0.52" stop-color="#878787"/>
      <stop offset="0.62" stop-color="#dcdcdc"/>
      <stop offset="0.78" stop-color="#757575"/>
      <stop offset="1" stop-color="#3f3f3f"/>
    </linearGradient>
  </defs>

  <!-- Anneau extérieur chrome -->
  <circle cx="200" cy="200" r="170" fill="none" stroke="url(#ring)" stroke-width="15"/>
  <circle cx="200" cy="200" r="178.4" fill="none" stroke="#303030" stroke-width="1.6" opacity="0.9"/>
  <circle cx="200" cy="200" r="161.6" fill="none" stroke="#262626" stroke-width="1.6" opacity="0.9"/>
  <path d="M 62.3 143.8 A 170 170 0 0 1 337.7 143.8" stroke="rgba(255,255,255,0.45)" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- Étoile à 3 branches (pointe haute, bas-gauche, bas-droite) -->
  <polygon points="200,42 213,200 187,200" fill="url(#star)" stroke="#2c2c2c" stroke-width="1.2"/>
  <polygon points="63.2,279 193.5,188.7 206.5,211.3" fill="url(#star)" stroke="#2c2c2c" stroke-width="1.2"/>
  <polygon points="336.8,279 193.5,211.3 206.5,188.7" fill="url(#star)" stroke="#2c2c2c" stroke-width="1.2"/>

  <!-- Arêtes brillantes (facettes du chrome) -->
  <line x1="200" y1="42" x2="200" y2="200" stroke="rgba(255,255,255,0.55)" stroke-width="2.4"/>
  <line x1="63.2" y1="279" x2="200" y2="200" stroke="rgba(255,255,255,0.5)" stroke-width="2.4"/>
  <line x1="336.8" y1="279" x2="200" y2="200" stroke="rgba(255,255,255,0.4)" stroke-width="2.4"/>

  <!-- Moyeu central -->
  <circle cx="200" cy="200" r="11" fill="url(#star)" stroke="#2c2c2c" stroke-width="1.2"/>
</svg>
